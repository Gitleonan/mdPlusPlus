name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 两个平台必须串行：tauri-action 生成 latest.json 时是「读现有文件 → 合并 platforms → 回写」，
# 并行跑会互相覆盖，导致某个平台的更新条目丢失。Windows 先跑，macOS 依赖它。
jobs:
  release-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 缺密钥时 build 要跑七八分钟才在打包阶段报错，这里先快速失败
      - name: Validate signing secrets
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY 为空"; exit 1; }
          [ -n "$PASS" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD 为空"; exit 1; }
          echo "签名密钥长度 ${#KEY}，密码已设置"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名私钥：Settings → Secrets and variables → Actions 里配置
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "md++ ${{ github.ref_name }}"
          releaseBody: |
            ## md++ ${{ github.ref_name }}

            轻量便捷的 Markdown 阅读器。

            ### Windows 下载

            - **`.exe`（NSIS 安装包）** — 标准安装包，支持应用内自动更新

            ### macOS 下载

            - **DMG** — 标准 macOS 磁盘映像（Apple Silicon）

            ### 系统要求

            - Windows 10 1809+（需 WebView2 运行时，Win11 默认自带）
            - macOS 11.0+ (Big Sur)

            ### 关于自动更新

            本版本起内置应用内更新检测。从 **0.4.2** 开始，之后的新版本会在应用内自动提示；
            0.4.1 及更早版本没有该功能，需手动下载安装本版一次。

            > 页面上的 `.sig`、`latest.json`、`.app.tar.gz` 是应用内自动更新所需的签名与元数据，无需手动下载。
          releaseDraft: true
          prerelease: false
          # 生成 latest.json 供自动更新使用（应用会从 releases/latest/download/latest.json 读取）
          includeUpdaterJson: true
          # 本项目 Windows 只出 NSIS（不含 MSI 自动更新条目），这里保持与 bundle.targets 一致
          updaterJsonPreferNsis: true

  release-macos:
    name: Build macOS
    runs-on: macos-latest
    # 串行 + 等 Windows 完成，避免 latest.json 并发读写互相覆盖
    needs: release-windows
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Validate signing secrets
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY 为空"; exit 1; }
          [ -n "$PASS" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD 为空"; exit 1; }
          echo "签名密钥长度 ${#KEY}，密码已设置"

      # 只出 Apple Silicon 构建：latest.json 里只会写 darwin-aarch64，
      # Intel Mac 用户收不到自动更新，需手动下载。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "md++ ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin
          includeUpdaterJson: true
